<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/portfolio/assets/mico-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem("pixelpop-color-theme"); } catch { /* Optional storage. */ }
        const root = document.documentElement;
        root.dataset.siteTheme = saved === "light" || saved === "dark" ? saved : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        const path = location.pathname;
        if (path === "/" || /^\/portfolio(?:\/|$)/.test(path)) root.dataset.siteSurface = "portfolio";
        else if (/^\/(?:dashboard|business|quick-entry|shared-bills|documents\/share)(?:\/|$)/.test(path)) root.dataset.siteSurface = "workspace";
      })();
    </script>
    <meta name="robots" content="noindex,follow" />
    <title>PixelPopup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Press+Start+2P&family=Saira+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Press+Start+2P&family=Saira+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
